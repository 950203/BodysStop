services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_NAME=${DB_NAME:-bodyshop}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-}
    # Para usar MySQL de XAMPP en Windows, ejecutar:
